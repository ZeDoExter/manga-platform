stages:
  - lint
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  DOCKER_TLS_CERTDIR: ""
  MIN_COVERAGE: "80"
# Code Quality & Static Analysis
lint:
  stage: lint
  image: golang:1.26-alpine
  script:
    - echo "Running go vet..."
    - go vet ./...

# Automated Tests & Coverage Gate
test:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: manga
    POSTGRES_PASSWORD: manga-demo-pw
    POSTGRES_DB: manga
  script:
    - echo "Running unit and integration tests on AKS Runner..."
    - |
      if nc -z localhost 5432 2>/dev/null; then
        export TEST_DATABASE_URL="postgres://manga:manga-demo-pw@localhost:5432/manga?sslmode=disable"
      else
        export TEST_DATABASE_URL="postgres://manga:manga-demo-pw@postgres:5432/manga?sslmode=disable"
      fi
    - go test -v -coverprofile=coverage.out ./...
    - go test -tags integration -coverprofile=coverage-pg.out ./services/catalog/ ./services/commerce/
    - COVERAGE=$(go test -cover -tags integration ./services/commerce/... | grep -o "[0-9.]*%" | tr -d "%")
    - echo "Commerce service test coverage (unit+integration) $COVERAGE percent"
    - awk -v c="$COVERAGE" 'BEGIN { if (c + 0 < 80) { print "FAILED_COVERAGE_BELOW_80"; exit 1 } print "PASSED_COVERAGE_OK" }'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 7 days

# Container Image Build (Kaniko in-cluster build -> Azure Container Registry)
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -n "$ACR_PASSWORD" ]; then
        AUTH=$(printf "%s:%s" "${ACR_USERNAME:-mangademoacr}" "$ACR_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"mangademoacr.azurecr.io":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
        /kaniko/executor --context "${CI_PROJECT_DIR}/web" --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" --destination "mangademoacr.azurecr.io/manga-web:${CI_COMMIT_SHORT_SHA}" --destination "mangademoacr.azurecr.io/manga-web:latest" --cache=true
      else
        /kaniko/executor --context "${CI_PROJECT_DIR}/web" --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" --no-push
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# Production Deployment (In-cluster AKS rollout via gitlab-runner ServiceAccount)
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "Rolling out latest images to AKS (https://dootoon.store)..."
    - kubectl apply -f deploy/k8s/service.yaml
    - kubectl apply -f deploy/k8s/gateway-prod.yaml
    - kubectl rollout restart deployment/web deployment/catalog deployment/commerce deployment/reader deployment/library deployment/community deployment/moderation deployment/media deployment/identity deployment/gateway
    - kubectl rollout status deployment/web --timeout=180s
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
