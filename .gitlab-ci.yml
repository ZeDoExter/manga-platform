stages:
  - lint
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  DOCKER_TLS_CERTDIR: ""
  MIN_COVERAGE: "80"
# Code Quality & Static Analysis
lint:
  stage: lint
  image: golang:1.26-alpine
  script:
    - echo "Running go vet..."
    - go vet ./...

# Automated Tests & Coverage Gate
test:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: manga
    POSTGRES_PASSWORD: manga-demo-pw
    POSTGRES_DB: manga
    TEST_DATABASE_URL: postgres://manga:manga-demo-pw@postgres:5432/manga?sslmode=disable
  script:
    - echo "Running unit and integration tests..."
    - go test -v -coverprofile=coverage.out ./...
    - go test -tags integration -coverprofile=coverage-pg.out ./services/catalog/ ./services/commerce/
    - COVERAGE=$(go test -cover -tags integration ./services/commerce/... | grep -o "[0-9.]*%" | tr -d "%")
    - echo "Commerce service test coverage (unit+integration) $COVERAGE percent"
    - awk -v c="$COVERAGE" 'BEGIN { if (c + 0 < 80) { print "FAILED_COVERAGE_BELOW_80"; exit 1 } print "PASSED_COVERAGE_OK" }'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 7 days

# Container Image Build
build:
  stage: build
  image: docker:24.0.5
  parallel:
    matrix:
      - SERVICE: [identity, catalog, commerce, reader, moderation, community, library, media, server, web]
  before_script:
    - |
      if [ -n "$ACR_PASSWORD" ]; then
        echo "$ACR_PASSWORD" | docker login mangademoacr.azurecr.io -u "${ACR_USERNAME:-mangademoacr}" --password-stdin
      elif [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
  script:
    - |
      if [ "$SERVICE" = "web" ]; then
        IMAGE="mangademoacr.azurecr.io/manga-web"
        docker build -t ${IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE}:latest ./web
      else
        IMAGE_NAME="$SERVICE"
        if [ "$SERVICE" = "server" ]; then IMAGE_NAME="gateway"; fi
        IMAGE="mangademoacr.azurecr.io/manga-${IMAGE_NAME}"
        docker build --build-arg SERVICE=${SERVICE} -t ${IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE}:latest .
      fi
    - |
      if [ -n "$ACR_PASSWORD" ]; then
        docker push ${IMAGE}:${CI_COMMIT_SHORT_SHA}
        docker push ${IMAGE}:latest
      fi

# Production Deployment
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "Executing rolling update deployment to AKS (dootoon.store)..."
    - |
      if [ -n "$KUBECONFIG_B64" ]; then
        mkdir -p ~/.kube
        echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
        kubectl apply -f deploy/k8s/service.yaml
        kubectl apply -f deploy/k8s/gateway-prod.yaml
        kubectl rollout restart deployment/web deployment/catalog deployment/commerce deployment/reader deployment/library deployment/community deployment/moderation deployment/media deployment/identity deployment/gateway
        kubectl rollout status deployment/web --timeout=180s
      else
        kubectl apply --dry-run=client -f deploy/k8s/service.yaml -f deploy/k8s/deployment.yaml
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
