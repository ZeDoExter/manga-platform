# Security scans: Go vulns (reachable), static analysis, leaked secrets,
# dependency/config scan, and race-detector tests. Runs on PRs + weekly schedule
# (new CVEs appear daily). CodeQL is intentionally NOT here: enable it via
# Settings -> Code security -> "CodeQL default setup" (auto-maintained by GitHub).
name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC

permissions:
  contents: read
  security-events: write # SARIF upload to Code scanning

jobs:
  govulncheck: # reachable vulns; RAR support was removed so this stays green
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  gosec: # static analysis of our own code (observe mode: triage before enforcing)
    name: gosec
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  gitleaks: # keys/passwords leaked into git history
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy: # repo deps + Dockerfile/K8s misconfig (images scanned from ACR on schedule)
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo + configs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # observe first; flip to 1 after triage
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Login to ACR (scheduled image scan only)
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: mangademoacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Scan published images
        if: github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            mangademoacr.azurecr.io/manga-web:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'schedule'
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  test-race: # unit tests under the race detector (integration tests stay in CI/CD)
    name: test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
