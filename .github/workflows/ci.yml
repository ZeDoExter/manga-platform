# DOOTOON CI/CD — mirrors azure-pipelines.yml (Lint -> Test -> Build -> Deploy).
# Free unlimited minutes: this repo is public, standard runners cost nothing.
name: CI/CD

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

permissions:
  contents: read

# One pipeline per branch: newer pushes cancel queued/in-progress runs so
# rapid pushes (or dependabot flurries) never stack up racing deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  ACR: mangademoacr.azurecr.io
  RESOURCE_GROUP: manga-demo-rg
  AKS_NAME: manga-demo-aks
  MIN_COVERAGE: "80"

jobs:
  lint:
    name: "Lint (go vet)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  test:
    name: "Test (+ coverage gate)"
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga-demo-pw
          POSTGRES_DB: manga
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://manga:manga-demo-pw@localhost:5432/manga?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test + coverage gate
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          go test -tags integration -coverprofile=coverage-pg.out ./services/catalog/ ./services/commerce/
          COVERAGE=$(go tool cover -func=coverage-pg.out | grep total | grep -o "[0-9.]*%")
          echo "Commerce service test coverage (unit+integration) $COVERAGE"
          awk -v c="$COVERAGE" -v min="$MIN_COVERAGE" 'BEGIN { gsub(/%/, "", c); if (c + 0 < min + 0) { print "FAILED_COVERAGE_BELOW_THRESHOLD"; exit 1 } print "PASSED_COVERAGE_OK" }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: "Build + push images to ACR"
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build + push 10 images
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          for spec in \
            "identity:identity:manga-identity" \
            "catalog:catalog:manga-catalog" \
            "commerce:commerce:manga-commerce" \
            "reader:reader:manga-reader" \
            "moderation:moderation:manga-moderation" \
            "community:community:manga-community" \
            "library:library:manga-library" \
            "media:media:manga-media" \
            "server:gateway:manga-gateway"; do
            svc="${spec%%:*}"; rest="${spec#*:}"; dep="${rest%%:*}"; img="${rest##*:}"
            echo "=== building $img (SERVICE=$svc) ==="
            docker build --build-arg SERVICE="$svc" -t "$ACR/$img:$SHORT" -t "$ACR/$img:latest" -f Dockerfile .
            docker push "$ACR/$img:$SHORT"
            docker push "$ACR/$img:latest"
          done
          echo "=== building manga-web ==="
          docker build --build-arg APP_VERSION="$SHORT" -t "$ACR/manga-web:$SHORT" -t "$ACR/manga-web:latest" -f web/Dockerfile ./web
          docker push "$ACR/manga-web:$SHORT"
          docker push "$ACR/manga-web:latest"

  staging:
    name: "Deploy staging + smoke test"
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Roll out staging + smoke test
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          NS=staging
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$AKS_NAME" --overwrite-existing
          kubectl create ns "$NS" --dry-run=client -o yaml | kubectl apply -f -
          # Mirror secrets; point postgres at the staging database.
          # Delete-first: kubelet can serve stale secret bytes to new pods
          # after in-place updates, so always recreate the objects.
          kubectl -n "$NS" delete secret postgres-auth web-secrets r2-credentials oolog-auth --ignore-not-found
          PROD_URL=$(kubectl -n default get secret postgres-auth -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          STG_URL=$(printf '%s' "$PROD_URL" | python3 -c "import sys,urllib.parse as u;p=u.urlsplit(sys.stdin.read().strip());print(u.urlunsplit((p.scheme,p.netloc,'/manga_staging',p.query,p.fragment)))")
          kubectl -n "$NS" create secret generic postgres-auth --from-literal=DATABASE_URL="$STG_URL" --dry-run=client -o yaml | kubectl apply -f -
          for s in web-secrets r2-credentials oolog-auth; do
            kubectl -n default get secret "$s" -o yaml | grep -vE '^\s*(creationTimestamp|resourceVersion|uid|selfLink):' | sed "s/namespace: default/namespace: $NS/" | kubectl apply -n "$NS" -f -
          done
          # Start from zero so rollouts never need surge headroom on small nodes.
          # Apply resets base replicas/images, so pin everything back to zero BEFORE
          # setting images: no pod is ever created from the placeholder image and
          # only the smoke path (web BFF -> catalog) scales up.
          kubectl -n "$NS" scale deployment --all --replicas=0 2>/dev/null || true
          kubectl apply -f deploy/k8s/service.yaml -n "$NS"
          kubectl apply -f deploy/k8s/deployment.yaml -n "$NS"
          kubectl -n "$NS" scale deployment --all --replicas=0
          for dep in identity catalog commerce reader moderation community library media gateway web; do
            img="manga-$dep"; [ "$dep" = "gateway" ] && img="manga-gateway"
            kubectl -n "$NS" set image "deployment/$dep" "$dep=$ACR/$img:$SHORT"
          done
          kubectl -n "$NS" scale deployment web catalog --replicas=1
          kubectl -n "$NS" rollout status deployment/web --timeout=180s
          kubectl -n "$NS" rollout status deployment/catalog --timeout=120s
          # Smoke: health, seed, login, auth gate, full story lifecycle.
          kubectl -n "$NS" port-forward svc/web 18080:80 >/tmp/pf.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/api/health >/dev/null && break
            sleep 5
          done
          B=http://127.0.0.1:18080
          curl -fsS "$B/api/health" || { echo "--- port-forward log ---"; cat /tmp/pf.log; exit 1; }
          curl -fsS -X POST "$B/api/auth/seed"
          HDRS=$(mktemp)
          curl -fsS -D "$HDRS" -o /dev/null -X POST "$B/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d '{"email":"creator@dootoon.store","password":"dootoon123"}'
          COOKIE=$(grep -i '^set-cookie:' "$HDRS" | sed 's/^[^:]*: *//;s/;.*//' | paste -sd';' -)
          [ -n "$COOKIE" ] || { echo "SMOKE FAIL: no session cookie"; exit 1; }
          SID="smoke-$SHORT"
          STORY="{\"story\":{\"id\":\"$SID\",\"title\":\"smoke\",\"type\":\"manga\",\"synopsis\":\"s\",\"tagline\":\"t\",\"genres\":[],\"tags\":[],\"chapters\":[]}}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/catalog" -H 'content-type: application/json' -d "$STORY")
          [ "$CODE" = "401" ] || { echo "SMOKE FAIL: anonymous write -> $CODE, want 401"; exit 1; }
          curl -fsS -X POST "$B/api/catalog" -H "Cookie: $COOKIE" -H 'content-type: application/json' -d "$STORY" >/dev/null
          curl -fsS "$B/api/catalog" | grep -q "$SID" || { echo "SMOKE FAIL: story not listed"; exit 1; }
          curl -fsS -X DELETE "$B/api/catalog?id=$SID" -H "Cookie: $COOKIE" >/dev/null
          curl -fsS "$B/api/catalog" | grep -q "$SID" && { echo "SMOKE FAIL: story present after delete"; exit 1; } || true
          echo "SMOKE OK"
          # Idle staging at zero between runs (next apply scales back up);
          # failures intentionally leave pods up for debugging.
          kubectl -n "$NS" scale deployment --all --replicas=0

  deploy:
    name: "Deploy to AKS (dootoon.store)"
    needs: [build, staging]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Pin images to build SHA + rollout
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$AKS_NAME" --overwrite-existing
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/networkpolicy.yaml
          kubectl apply -f deploy/k8s/hpa.yaml
          kubectl apply -f deploy/k8s/pdb.yaml
          kubectl apply -f deploy/k8s/gateway-prod.yaml
          for pair in \
            "identity:manga-identity" \
            "catalog:manga-catalog" \
            "commerce:manga-commerce" \
            "reader:manga-reader" \
            "moderation:manga-moderation" \
            "community:manga-community" \
            "library:manga-library" \
            "media:manga-media" \
            "gateway:manga-gateway" \
            "web:manga-web"; do
            dep="${pair%%:*}"; img="${pair##*:}"
            kubectl -n default set image "deployment/$dep" "$dep=$ACR/$img:$SHORT"
          done
          kubectl -n default rollout status deployment/web --timeout=180s
          kubectl -n default get pods -l 'app.kubernetes.io/part-of=manga-platform'
      - name: Deploy Cloudflare Workers (Edge)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "=== Deploying Cloudflare Workers via Wrangler ==="
            npx --yes wrangler deploy infra/cloudflare/r2-gate-worker.js --name dootoon-r2-gate --compatibility-date 2024-01-01
            npx --yes wrangler deploy infra/cloudflare/maintenance-worker.js --name dootoon-maintenance --compatibility-date 2024-01-01
            echo "Cloudflare Workers deployed successfully."
          else
            echo "Notice: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set. Skipping Cloudflare Workers deployment."
          fi
