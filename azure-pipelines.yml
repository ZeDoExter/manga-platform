# Azure DevOps pipeline for DOOTOON (manga-platform).
# Parity with .gitlab-ci.yml: lint -> test (+coverage gate) -> build (ACR) -> deploy (AKS).
# Triggers: all branches run lint+test; only master builds images and deploys to https://dootoon.store.
# Required setup (one-time, see docs/agents/azure-devops.md):
#   1. Azure DevOps project + repo (import from GitLab or move remote to Azure Repos).
#   2. Service connection "dootoon-azure" (Azure Resource Manager, Workload Identity federation).
#      Needs AcrPush on mangademoacr + Azure Kubernetes Service Cluster Admin on manga-demo-aks.
#   3. Grant the pipeline permission to use the service connection when first run prompts.

trigger:
  branches:
    include:
      - master
      - feat/*
pr:
  branches:
    include:
      - master

variables:
  goVersion: "1.26"
  acrLoginServer: "mangademoacr.azurecr.io"
  resourceGroup: "manga-demo-rg"
  aksName: "manga-demo-aks"
  serviceConnection: "dootoon-azure"
  acrConnection: "dootoon-acr"
  minCoverage: "80"

stages:
  - stage: Lint
    displayName: "Lint (go vet)"
    jobs:
      - job: Lint
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - task: GoTool@0
            inputs:
              version: "$(goVersion)"
          - script: go vet ./...
            displayName: "go vet ./..."

  - stage: Test
    displayName: "Test (+ coverage gate)"
    dependsOn: Lint
    jobs:
      - job: Test
        pool:
          vmImage: "ubuntu-24.04"
        services:
          postgres:
            image: postgres:16-alpine
            env:
              POSTGRES_USER: manga
              POSTGRES_PASSWORD: manga-demo-pw
              POSTGRES_DB: manga
            ports:
              - 5432:5432
        variables:
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga-demo-pw
          POSTGRES_DB: manga
          TEST_DATABASE_URL: postgres://manga:manga-demo-pw@localhost:5432/manga?sslmode=disable
        steps:
          - task: GoTool@0
            inputs:
              version: "$(goVersion)"
          - script: |
              go test -v -coverprofile=coverage.out ./...
              go test -tags integration -coverprofile=coverage-pg.out ./services/catalog/ ./services/commerce/
              COVERAGE=$(go tool cover -func=coverage-pg.out | grep total | grep -o "[0-9.]*%")
              echo "Commerce service test coverage (unit+integration) $COVERAGE"
              awk -v c="$COVERAGE" -v min="$(minCoverage)" 'BEGIN { gsub(/%/, "", c); if (c + 0 < min + 0) { print "FAILED_COVERAGE_BELOW_THRESHOLD"; exit 1 } print "PASSED_COVERAGE_OK" }'
            displayName: "go test + coverage gate"
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: Go
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/coverage.out"

  - stage: Build
    displayName: "Build + push images to ACR"
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: BuildAll
        displayName: "Build all images (one agent, warm cache)"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(acrConnection)"
              command: login
          - script: |
              set -euo pipefail
              SHA="$(Build.SourceVersion)"
              SHORT="${SHA:0:7}"
              ACR="$(acrLoginServer)"
              echo "##vso[task.setvariable variable=imageTag;isOutput=false]$SHORT"
              for spec in \
                "identity:identity:manga-identity" \
                "catalog:catalog:manga-catalog" \
                "commerce:commerce:manga-commerce" \
                "reader:reader:manga-reader" \
                "moderation:moderation:manga-moderation" \
                "community:community:manga-community" \
                "library:library:manga-library" \
                "media:media:manga-media" \
                "server:gateway:manga-gateway"; do
                svc="${spec%%:*}"; rest="${spec#*:}"; dep="${rest%%:*}"; img="${rest##*:}"
                echo "=== building $img (SERVICE=$svc) ==="
                docker build --build-arg SERVICE="$svc" -t "$ACR/$img:$SHORT" -t "$ACR/$img:latest" -f Dockerfile .
                docker push "$ACR/$img:$SHORT"
                docker push "$ACR/$img:latest"
              done
              echo "=== building manga-web ==="
              docker build -t "$ACR/manga-web:$SHORT" -t "$ACR/manga-web:latest" -f web/Dockerfile ./web
              docker push "$ACR/manga-web:$SHORT"
              docker push "$ACR/manga-web:latest"
            displayName: "Build + push 10 images"

  - stage: Deploy
    displayName: "Deploy to AKS (dootoon.store)"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: DeployAKS
        displayName: "Rolling update AKS"
        pool:
          vmImage: "ubuntu-24.04"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: "Pin images to build SHA + rollout"
                  inputs:
                    azureSubscription: "$(serviceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      SHORT="$(Build.SourceVersion)"
                      SHORT="${SHORT:0:7}"
                      ACR="$(acrLoginServer)"
                      az aks get-credentials -g "$(resourceGroup)" -n "$(aksName)" --overwrite-existing
                      kubectl apply -f deploy/k8s/service.yaml
                      kubectl apply -f deploy/k8s/gateway-prod.yaml
                      for pair in \
                        "identity:manga-identity" \
                        "catalog:manga-catalog" \
                        "commerce:manga-commerce" \
                        "reader:manga-reader" \
                        "moderation:manga-moderation" \
                        "community:manga-community" \
                        "library:manga-library" \
                        "media:manga-media" \
                        "gateway:manga-gateway" \
                        "web:manga-web"; do
                        dep="${pair%%:*}"; img="${pair##*:}"
                        kubectl -n default set image "deployment/$dep" "$dep=$ACR/$img:$SHORT"
                      done
                      kubectl -n default rollout status deployment/web --timeout=180s
                      kubectl -n default get pods -l 'app.kubernetes.io/part-of=manga-platform' --no-headers | head -12
