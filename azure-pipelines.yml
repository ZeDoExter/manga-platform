trigger:
  branches:
    include:
      - master
      - feat/*
pr:
  branches:
    include:
      - master

variables:
  acrLoginServer: "mangademoacr.azurecr.io"
  resourceGroup: "manga-demo-rg"
  aksName: "manga-demo-aks"
  serviceConnection: "dootoon-azure"
  acrConnection: "dootoon-acr"

stages:
  - stage: Lint
    displayName: "Lint & Validate"
    jobs:
      - job: QuickLint
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - script: |
              echo "=== Fast validation: Web UI & Configs ==="
              echo "Lint check passed."
            displayName: "Validate configs"

  - stage: Build
    displayName: "Build + push Web UI to ACR"
    dependsOn: Lint
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: BuildWeb
        displayName: "Build Web Image"
        pool:
          vmImage: "ubuntu-24.04"
        steps:
          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(acrConnection)"
              command: login
          - script: |
              set -euo pipefail
              SHA="$(Build.SourceVersion)"
              SHORT="${SHA:0:7}"
              ACR="$(acrLoginServer)"
              echo "##vso[task.setvariable variable=imageTag;isOutput=false]$SHORT"
              echo "=== building manga-web ($SHORT) ==="
              docker build -t "$ACR/manga-web:$SHORT" -t "$ACR/manga-web:latest" -f web/Dockerfile ./web
              docker push "$ACR/manga-web:$SHORT"
              docker push "$ACR/manga-web:latest"
            displayName: "Build + push manga-web"

  - stage: Deploy
    displayName: "Deploy to AKS (dootoon.store)"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: DeployAKS
        displayName: "Rolling update Web on AKS"
        pool:
          vmImage: "ubuntu-24.04"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: "Rolling update Web to new SHA"
                  inputs:
                    azureSubscription: "$(serviceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      SHORT="$(Build.SourceVersion)"
                      SHORT="${SHORT:0:7}"
                      ACR="$(acrLoginServer)"
                      az aks get-credentials -g "$(resourceGroup)" -n "$(aksName)" --overwrite-existing
                      kubectl -n default set image deployment/web web="$ACR/manga-web:$SHORT"
                      kubectl -n default rollout status deployment/web --timeout=120s
                      kubectl -n default get pods -l 'app.kubernetes.io/name=web'
