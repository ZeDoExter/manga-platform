<!DOCTYPE html>
<!-- PROTOTYPE — throwaway. Three variants of home (?variant=a|b|c) + story + reader (?page=home|story|reader). Fold winner into real Next.js later, then move this file to a throwaway branch. -->
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manga Prototype — Shelf / Bento / Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1116; --bg:var(--ink); --surface:#171A23; --surface2:#1F2330;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.06);
  --text:#EDEEF2; --muted:#9AA0B4; --faint:#6b7186;
  --hanko:#E5484D; --hanko-d:#c93a40; --coin:#F5B544; --sage:#7ED0A5; --sky:#7C9BF4;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font-d:"Noto Serif Thai",serif; --font-b:"Inter","Noto Sans Thai",sans-serif;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --max:1200px;
}
html[data-theme="light"]{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#F1EDE3;
  --line:rgba(20,22,35,.12); --line2:rgba(20,22,35,.07);
  --text:#15161B; --muted:#62687c; --faint:#9aa0b4;
  --shadow:0 12px 32px rgba(30,25,15,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.6;min-height:100vh;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.serif{font-family:var(--font-d)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px 140px}
@media(min-width:900px){.wrap{padding:0 28px 120px}}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line2)}
.topbar-in{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
@media(min-width:900px){.topbar-in{padding:14px 28px}}
.logo{display:flex;align-items:center;gap:9px;font-weight:700}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#E5484D,#8f1f2e);display:grid;place-items:center;color:#fff;font-family:var(--font-d);font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(229,72,77,.4)}
.logo small{font-weight:500;color:var(--muted);font-size:12px;display:block;line-height:1}
.nav-desktop{display:none;gap:4px;margin-left:18px}
@media(min-width:900px){.nav-desktop{display:flex}}
.nav-desktop a{padding:8px 13px;border-radius:99px;color:var(--muted);font-weight:500;font-size:14px}
.nav-desktop a.on{background:var(--surface2);color:var(--text)}
.search{flex:1;display:flex;justify-content:flex-end}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-width:0;width:100%;max-width:300px;color:var(--muted);font-size:13.5px}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%;font-family:inherit;font-size:13.5px}
.coin-pill{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#2a2214,#1c170c);border:1px solid rgba(245,181,68,.4);color:var(--coin);font-weight:700;font-size:13.5px;padding:8px 13px;border-radius:99px;white-space:nowrap;cursor:pointer}
html[data-theme="light"] .coin-pill{background:#FFF6E2}
.coin-pill .c{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a3,var(--coin) 65%);display:grid;place-items:center;color:#5a3c00;font-size:11px;font-weight:800}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7C9BF4,#9b7cf4);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
/* ---------- section ---------- */
.sec-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-head h2{font-family:var(--font-d);font-size:19px;margin:0;font-weight:700;letter-spacing:.1px}
.sec-head .more{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sec-head .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:700}
/* ---------- cover card shared ---------- */
.cover{position:relative;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;background:var(--surface2);border:1px solid var(--line2);isolation:isolate}
.cover-art{position:absolute;inset:0}
.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.cover-meta{position:absolute;left:10px;right:10px;bottom:9px;z-index:2}
.cover-meta b{display:block;font-size:12.5px;line-height:1.35;font-weight:600}
.cover-meta span{font-size:11px;color:rgba(255,255,255,.72)}
.spine{position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,.16);z-index:2}
.spine i{display:block;width:100%;background:var(--hanko);border-radius:0 0 4px 0}
.hanko{position:absolute;top:8px;right:8px;z-index:2;min-width:30px;height:30px;padding:0 7px;border-radius:9px;background:var(--hanko);color:#fff;display:flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.hanko.free{background:rgba(20,22,30,.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);font-weight:600}
.hanko.owned{background:var(--sage);color:#0c2317}
.type-tag{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);color:#fff;padding:3px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.card-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
/* ---------- VARIANT A : shelf ---------- */
.grid-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
@media(min-width:700px){.grid-shelf{grid-template-columns:repeat(6,1fr)}}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-card{flex:0 0 230px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-md);padding:12px;display:flex;gap:12px;align-items:center}
.rail-card .cover{width:56px;flex-shrink:0;border-radius:8px}
.rail-card b{font-size:13px;display:block;line-height:1.4}
.rail-card .bar{height:5px;border-radius:99px;background:var(--surface2);margin-top:8px;overflow:hidden;border:1px solid var(--line2)}
.rail-card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hanko),#ff8a5c);border-radius:99px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12.5px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
/* ---------- VARIANT B : bento ---------- */
.bento{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.bento{grid-template-columns:1.9fr 1fr 1fr;grid-auto-rows:minmax(120px,auto)}}
.b-card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-lg);overflow:hidden;position:relative;min-height:150px}
.b-hero{grid-column:1/-1;display:grid;grid-template-columns:110px 1fr;gap:16px;padding:18px;align-items:center;background:linear-gradient(120deg,#1b1e2b 0%,#232033 55%,#3a1f28 100%)}
html[data-theme="light"] .b-hero{background:linear-gradient(120deg,#1b1e2b,#3a2b3f 60%,#5c2b33);color:#fff}
.b-hero .cover{width:110px}
.b-hero h1{font-family:var(--font-d);font-size:clamp(21px,3.4vw,32px);margin:0 0 6px;line-height:1.25}
.b-hero p{margin:0;color:rgba(255,255,255,.72);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-hero .cta-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
@media(min-width:900px){.b-hero{grid-column:span 2;grid-row:span 2;grid-template-columns:170px 1fr;padding:26px}.b-hero .cover{width:170px}.b-hero p{-webkit-line-clamp:3}}
.b-side{padding:18px}
.b-side h3{margin:0 0 4px;font-family:var(--font-d);font-size:16px}
.b-side p{margin:0;color:var(--muted);font-size:13px}
.rank{display:flex;flex-direction:column}
.rank-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.rank-row:last-child{border:none}
.rank-n{font-family:var(--font-d);font-size:22px;font-weight:800;width:30px;color:var(--faint)}
.rank-row:first-child .rank-n{color:var(--hanko)}
.rank-thumb{width:44px;height:58px;border-radius:8px;flex-shrink:0;border:1px solid var(--line2)}
.rank-row b{font-size:13px;display:block;line-height:1.4}
.rank-row span{font-size:11.5px;color:var(--muted)}
.stat-big{font-family:var(--font-d);font-size:30px;font-weight:800}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mini-grid .cover{border-radius:10px}
/* ---------- VARIANT C : feed ---------- */
.hero-strip{border-radius:var(--r-lg);overflow:hidden;position:relative;background:linear-gradient(100deg,#151824 10%,#2b2140 55%,#57232e 100%);border:1px solid var(--line2);padding:26px 22px;display:grid;gap:8px}
html[data-theme="light"] .hero-strip{color:#fff}
.hero-strip .kicker{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--coin)}
.hero-strip h1{font-family:var(--font-d);font-size:clamp(22px,3.6vw,34px);margin:0;line-height:1.25;max-width:16em}
.hero-strip p{margin:0;color:rgba(255,255,255,.7);font-size:13.5px;max-width:36em}
.feed-cols{display:grid;gap:18px;margin-top:16px;grid-template-columns:1fr}
@media(min-width:900px){.feed-cols{grid-template-columns:1fr 300px}}
.feed-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-lg);overflow:hidden}
.feed-row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:center}
.feed-row:last-child{border:none}
.feed-row .cover{width:58px;flex-shrink:0;border-radius:9px}
.feed-row b{font-size:14px}
.side-box{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-lg);padding:18px;height:fit-content;position:sticky;top:76px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;padding:11px 20px;border-radius:12px;transition:.15s}
.btn-primary{background:var(--hanko);color:#fff;box-shadow:0 6px 20px rgba(229,72,77,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-coin{background:linear-gradient(180deg,#ffce6b,#eda426);color:#3a2700}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
/* ---------- story page ---------- */
.story-hero{display:grid;grid-template-columns:118px 1fr;gap:16px;margin-top:18px}
@media(min-width:700px){.story-hero{grid-template-columns:190px 1fr;gap:24px}}
.story-hero .cover{border-radius:16px;box-shadow:var(--shadow)}
.story-hero h1{font-family:var(--font-d);font-size:clamp(20px,3.4vw,30px);margin:0;line-height:1.3}
.meta-chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.mchip{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.mchip.hot{border-color:rgba(229,72,77,.5);color:var(--hanko)}
.syn{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 0}
.action-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.split{margin-top:12px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
.split-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px}
.tabs{display:flex;gap:4px;margin:20px 0 6px;border-bottom:1px solid var(--line2);position:sticky;top:57px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:10}
.tabs button{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--hanko)}
.ch-row{display:flex;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line2)}
.ch-num{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:var(--font-d)}
.ch-row b{font-size:13.5px;display:block}
.ch-row span{font-size:12px;color:var(--muted)}
.ch-row .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.lock{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.lock.free{background:rgba(126,208,165,.15);color:var(--sage);border:1px solid rgba(126,208,165,.35)}
.lock.coin{background:rgba(245,181,68,.14);color:var(--coin);border:1px solid rgba(245,181,68,.4)}
.lock.owned{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.comment{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:13px 14px;margin-top:10px}
.comment .who{display:flex;gap:9px;align-items:center;font-size:12.5px}
.comment .ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
/* ---------- reader ---------- */
.reader-bar{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.reader-bar-in{max-width:800px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:16px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.page-col{max-width:800px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
.mpage{border-radius:14px;overflow:hidden;border:1px solid var(--line2);position:relative;min-height:420px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.mpage .pg{position:absolute;bottom:10px;right:12px;font-size:11px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.2)}
.novel{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:26px 22px}
@media(min-width:700px){.novel{padding:36px 40px}}
.novel h2{font-family:var(--font-d);margin:0 0 14px}
.novel p{line-height:2;color:var(--text);opacity:.92}
.paywall{max-width:520px;margin:30px auto;background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:var(--shadow)}
.ad{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--muted);text-align:center;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.reader-nav{display:flex;gap:10px;max-width:800px;margin:0 auto 30px;padding:0 14px}
.reader-nav .btn{flex:1;justify-content:center}
/* ---------- mobile tabs ---------- */
.mtabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line2);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
@media(min-width:900px){.mtabs{display:none}}
.mtabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px}
.mtabs a.on{color:var(--text)}
.mtabs .ic{font-size:19px;line-height:1}
/* ---------- prototype switcher ---------- */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:60;background:#101116;color:#fff;border:1.5px solid var(--coin);border-radius:99px;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12px;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
@media(min-width:900px){.proto{bottom:22px}}
.proto .plabel{font-weight:700;color:var(--coin);letter-spacing:.4px}
.proto button{background:#22242e;border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
.proto button.on{background:var(--coin);color:#221a05;border-color:var(--coin)}
.proto .arrow{width:30px;height:30px;display:grid;place-items:center;padding:0}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:130px;background:#101116;color:#fff;border:1px solid rgba(255,255,255,.16);padding:11px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--coin)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.row2{grid-template-columns:1fr 1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px}
.kpi b{font-family:var(--font-d);font-size:22px;display:block}
.kpi span{font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--hanko);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="logo" href="?page=home&variant=a"><span class="logo-mark">ม</span><span>มังงะฮับ<small>MANGA · NOVEL</small></span></a>
  <nav class="nav-desktop">
    <a href="?page=home&variant=a" data-nav="home">หน้าแรก</a>
    <a href="?page=story&variant=a" data-nav="story">เรื่อง</a>
    <a href="?page=reader&variant=a" data-nav="reader">อ่าน</a>
  </nav>
  <div class="search"><label class="search-box">⌕ <input id="q" placeholder="ค้นหาเรื่อง นักแปล แท็ก…"></label></div>
  <div class="coin-pill" id="wallet" title="กระเป๋าเหรียญ (FR-M2)"> <span class="c">฿</span> <span id="coins">120</span> </div>
  <div class="avatar">N</div>
</div></div>

<div class="wrap" id="app"></div>

<nav class="mtabs">
  <a href="?page=home&variant=a" data-nav="home"><span class="ic">⌂</span>หน้าแรก</a>
  <a href="?page=story&variant=a" data-nav="story"><span class="ic">▤</span>ห้องสมุด</a>
  <a href="?page=reader&variant=a" data-nav="reader"><span class="ic">◫</span>อ่าน</a>
  <a href="#" onclick="toast('เหรียญคงเหลือ <b>'+state.coins+'</b> · bonus แยกจาก purchased (FR-M2)');return false"><span class="ic">◉</span>เหรียญ</a>
  <a href="#" onclick="toast('โปรไฟล์ · Guest เห็นโฆษณาคั่น / User เห็นแค่แบนเนอร์บน (FR-X3)');return false"><span class="ic">○</span>ฉัน</a>
</nav>

<div class="proto" role="toolbar" aria-label="prototype switcher">
  <span class="plabel">PROTO</span>
  <button class="arrow" id="prevV" aria-label="previous variant">←</button>
  <span id="vlabel" style="font-weight:700"></span>
  <button class="arrow" id="nextV" aria-label="next variant">→</button>
  <button data-v="a">A·Shelf</button>
  <button data-v="b">B·Bento</button>
  <button data-v="c">C·Feed</button>
  <span style="opacity:.35">|</span>
  <button data-p="home">Home</button>
  <button data-p="story">Story</button>
  <button data-p="reader">Reader</button>
  <span style="opacity:.35">|</span>
  <button id="themeBtn">🌙/☀️</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
let variant=params.get('variant')||'a';
let page=params.get('page')||'home';
if(!['a','b','c'].includes(variant))variant='a';
if(!['home','story','reader'].includes(page))page='home';
// theme
let theme=localStorage.getItem('manga-theme')||params.get('theme')||'dark';
document.documentElement.dataset.theme=theme;
const state={coins:120,owned:new Set([2]),following:false,readerMode:'paged',novelFS:17,filter:'ทั้งหมด'};
const VNAMES={a:'A — Shelf (Mihon)',b:'B — Bento minimal',c:'C — Feed (Duketoon)'};
$('#vlabel').textContent=VNAMES[variant]+' · '+page;

const STORIES=[
 {id:1,title:'ดาบหิมะเลือดมังกร',type:'มังงะ',status:'จบแล้ว',tags:['แอ็กชัน','กำลังภายใน'],ch:68,upd:'2 ชม.ก่อน',prog:72,hue:[232,42,52],price:0,desc:'จอมยุทธ์หนุ่มกับดาบต้องสาป'},
 {id:2,title:'คืนนี้ฟ้ามีแค่เรา',type:'นิยาย',status:'ต่อเนื่อง',tags:['โรแมนซ์','ดราม่า'],ch:142,upd:'12 นาทีที่แล้ว',prog:35,hue:[262,52,68],price:5,desc:'จดหมายที่ไม่เคยถูกส่ง'},
 {id:3,title:'ร้านชำยามวิกาล',type:'มังงะ',status:'ต่อเนื่อง',tags:['สไลซ์ออฟไลฟ์'],ch:24,upd:'1 ชม.ก่อน',prog:90,hue:[18,72,58],price:3,desc:'ร้านชำที่เปิดเฉพาะคนนอนไม่หลับ'},
 {id:4,title:'เนโครแมนเซอร์ฝึกหัด',type:'มังงะ',status:'ต่อเนื่อง',tags:['แฟนตาซี'],ch:51,upd:'เมื่อวาน',prog:12,hue:[160,40,42],price:5,desc:'ปลุกผีครั้งแรกก็พังเลย'},
 {id:5,title:'บันทึกดาวตก',type:'นิยาย',status:'จบแล้ว',tags:['ไซไฟ'],ch:89,upd:'3 วันที่แล้ว',prog:0,hue:[210,60,50],price:0,desc:'สัญญาณจากอวกาศ'},
 {id:6,title:'ครัวหลังวัง',type:'มังงะ',status:'ต่อเนื่อง',tags:['อาหาร','ย้อนยุค'],ch:33,upd:'5 ชม.ก่อน',prog:55,hue:[38,80,55],price:4,desc:'พ่อครัวตัวจิ๋วในวังหลวง'},
 {id:7,title:'เสียงฝนในกล่องเหล็ก',type:'นิยาย',status:'ต่อเนื่อง',tags:['ลึกลับ'],ch:47,upd:'เมื่อเช้า',prog:0,hue:[190,45,40],price:6,desc:'เทปคาสเซ็ตปริศนา'},
 {id:8,title:'หมัดดาวเหนือคาเฟ่',type:'มังงะ',status:'ต่อเนื่อง',tags:['คอมเมดี้'],ch:19,upd:'2 วันที่แล้ว',prog:0,hue:[330,45,55],price:0,desc:'นักชกมาเปิดคาเฟ่'},
];
function art(h,s,l){return `background:linear-gradient(160deg,hsl(${h} ${s}% ${l+14}%),hsl(${h+24} ${s}% ${l-8}%));`}
function coverHTML(st,showPrice=true){
  const free=st.price===0, owned=state.owned.has(st.id);
  const badge=owned?'<span class="hanko owned">✓ มีแล้ว</span>':free?'<span class="hanko free">FREE</span>':`<span class="hanko">◉ ${st.price}</span>`;
  return `<div class="cover"><div class="cover-art" style="${art(st.hue[0],st.hue[1],st.hue[2])}"></div>
    <div class="spine"><i style="height:${st.prog}%"></i></div>
    <span class="type-tag">${st.type}</span>${showPrice?badge:''}
    <div class="cover-shade"></div><div class="cover-meta"><b>${st.title}</b><span>ตอนที่ ${st.ch} · ${st.upd}</span></div></div>`;
}
function toast(html){const t=$('#toast');t.innerHTML=html;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600);}
function go(p={},replace=false){
  const q=new URLSearchParams({variant,page,...p});if(theme!=='dark')q.set('theme',theme);
  const url='?'+q.toString(); replace?history.replaceState(null,'',url):location.href=url;
}
function buy(st){
  if(state.owned.has(st.id)){go({page:'reader'});return;}
  if(state.coins<st.price){toast('เหรียญไม่พอ — เติมผ่าน PromptPay QR (FR-M1/FR-PAY1)');return;}
  state.coins-=st.price;state.owned.add(st.id);$('#coins').textContent=state.coins;
  toast(`ปลดล็อก <b>${st.title}</b> · −${st.price} เหรียญ · ลง ledger + แบ่งทีมวาด (FR-M3/M4)`);
  setTimeout(()=>render(),900);
}
$('#coins').textContent=state.coins;
$('#wallet').onclick=()=>toast(`คงเหลือ <b>${state.coins}</b> เหรียญ · purchased/bonus แยกกัน (FR-M2) · แตะเพื่อเติม`);
$('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('manga-theme',theme);document.documentElement.dataset.theme=theme;};
document.querySelectorAll('.proto [data-v]').forEach(b=>{b.classList.toggle('on',b.dataset.v===variant);b.onclick=()=>go({variant:b.dataset.v});});
document.querySelectorAll('.proto [data-p]').forEach(b=>{b.classList.toggle('on',b.dataset.p===page);b.onclick=()=>go({page:b.dataset.p});});
$('#prevV').onclick=()=>{const o=['a','b','c'];go({variant:o[(o.indexOf(variant)+2)%3]});};
$('#nextV').onclick=()=>{const o=['a','b','c'];go({variant:o[(o.indexOf(variant)+1)%3]});};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowLeft')$('#prevV').click();if(e.key==='ArrowRight')$('#nextV').click();});
document.querySelectorAll('[data-nav]').forEach(a=>{const u=new URL(a.href,location.href);u.searchParams.set('variant',variant);a.href=u.toString();if(a.dataset.nav===page)a.classList.add('on');});
$('#q').addEventListener('input',e=>{if(page!=='home')return;state.q=e.target.value.trim();renderHome();});

// ---------- HOME ----------
function secHead(eyebrow,title,more){return `<div class="sec-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><a class="more" href="#">${more} →</a></div>`;}
function continueRail(){
  const items=STORIES.filter(s=>s.prog>0).map(s=>`<div class="rail-card"><div>${coverHTML(s,false)}</div>
    <div style="min-width:0"><b>${s.title}</b><span style="font-size:11.5px;color:var(--muted)">ค้างตอนที่ ${Math.max(1,Math.round(s.ch*s.prog/100))} · ${s.prog}%</span>
    <div class="bar"><i style="width:${s.prog}%"></i></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="event.stopPropagation();go({page:'reader'})">อ่านต่อ</button></div></div>`).join('');
  return secHead('Library · FR-L3','อ่านต่อ','ชั้นของฉัน')+`<div class="rail">${items}</div>`;
}
function gridAll(){
  const list=STORIES.filter(s=>!state.q||s.title.includes(state.q));
  return secHead('Catalog · FR-C1','เรื่องทั้งหมด','ดูทั้งหมด')+
  `<div class="chip-row">${['ทั้งหมด','มังงะ','นิยาย','จบแล้ว','ฟรี'].map((c,i)=>`<span class="chip ${i===0?'on':''}">${c}</span>`).join('')}</div>
  <div class="grid-shelf" style="margin-top:12px">${list.map(s=>`<a href="?page=story&variant=${variant}" onclick="event.preventDefault();go({page:'story'})"><div>${coverHTML(s)}</div><div class="card-sub">${s.type}<span class="dot"></span>${s.status}<span class="dot"></span>★ 4.${s.id+5}</div></a>`).join('')}</div>`;
}
function renderHome(){
  const el=$('#app');
  if(variant==='a'){
    el.innerHTML=continueRail()+secHead('Trending · FR-C4','มาแรงประจำสัปดาห์','จัดอันดับ')+
    `<div class="grid-shelf">${STORIES.slice(0,6).map(s=>`<a href="#" onclick="go({page:'story'});return false"><div>${coverHTML(s)}</div><div class="card-sub">#${s.id} · ${s.upd}</div></a>`).join('')}</div>`+gridAll()+
    `<div class="ad" style="margin-top:18px">AD · Guest = คั่นระหว่างตอน / User = แบนเนอร์บนเท่านั้น / สมาชิก = ไม่มี (FR-X3)</div>`;
  }else if(variant==='b'){
    const f=STORIES[1];
    el.innerHTML=`<div class="bento" style="margin-top:18px">
      <div class="b-card b-hero"><div>${coverHTML(f)}</div>
        <div><div class="eyebrow" style="font-size:11px;letter-spacing:2px;color:var(--coin);font-weight:700">✦ FEATURED · ตอนใหม่ทุกวันศุกร์</div>
        <h1>${f.title}</h1><p>${f.desc} — ${f.type} · ${f.status} · ${f.tags.join(' · ')} อ่านฟรี 3 ตอนแรก แล้วปลดล็อกด้วยเหรียญ ทีมวาดได้ส่วนแบ่งทุกการซื้อ (FR-M4)</p>
        <div class="cta-row"><button class="btn btn-primary" onclick="go({page:'reader'})">เริ่มอ่านตอนที่ 1</button><button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)" onclick="go({page:'story'})">รายละเอียด</button></div></div></div>
      <div class="b-card b-side"><h3>อ่านต่อ</h3><p>ค้างไว้ ${STORIES.filter(s=>s.prog>0).length} เรื่อง · sync ข้ามเครื่อง (FR-L1)</p>
        <div class="mini-grid">${STORIES.filter(s=>s.prog>0).slice(0,4).map(s=>coverHTML(s,false)).join('')}</div>
        <button class="btn btn-ghost btn-sm" style="margin-top:12px;width:100%;justify-content:center" onclick="go({page:'reader'})">อ่านต่อเลย →</button></div>
      <div class="b-card b-side"><h3>กระเป๋า</h3><p>แยก purchased / bonus (FR-M2)</p><div class="stat-big" style="color:var(--coin)">${state.coins} <span style="font-size:13px;color:var(--muted)">เหรียญ</span></div>
        <button class="btn btn-coin btn-sm" style="margin-top:10px" onclick="toast('เติมผ่าน PromptPay QR / บัตร / e-wallet (FR-PAY1)')">+ เติมเหรียญ</button></div>
      <div class="b-card b-side rank" style="grid-column:1/-1"><div style="padding:2px 0 6px"><h3>ชาร์ตประจำวัน</h3><p>views + ซื้อจริง ไม่ปั่น (FR-C4)</p></div>
        <div class="row2">${STORIES.slice(0,6).map((s,i)=>`<div class="rank-row"><span class="rank-n">${i+1}</span><div class="rank-thumb" style="${art(s.hue[0],s.hue[1],s.hue[2])}"></div><div><b>${s.title}</b><span>${s.type} · ${s.upd}</span></div></div>`).join('')}</div></div>
    </div>`+gridAll();
  }else{
    const f=STORIES[0];
    el.innerHTML=`<div class="hero-strip" style="margin-top:18px"><span class="kicker">DUKETOON STYLE · อ่านฟรีทุกวัน</span>
      <h1>${f.title} — ตอนใหม่ ${f.ch} มาแล้ว</h1><p>${f.desc} · อ่านลื่นทั้งมือถือและเดสก์ท็อป โหมดมืดถนอมสายตา ฟอนต์ไทยอ่านง่าย</p>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="go({page:'reader'})">อ่านตอนล่าสุด</button><button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)" onclick="go({page:'story'})">ชั้นหนังสือ</button></div></div>
    <div class="feed-cols"><div class="feed-list">
      ${STORIES.map((s,i)=>`<div class="feed-row"><div>${coverHTML(s)}</div><div style="min-width:0"><b>${i+1}. ${s.title}</b><div style="font-size:12px;color:var(--muted)">${s.type} · ${s.tags.join(', ')} · ${s.upd}</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="go({page:'story'})">รายละเอียด</button>${s.price?`<button class="btn btn-coin btn-sm" onclick='buyById(${s.id})'>◉ ${s.price}</button>`:`<button class="btn btn-ghost btn-sm" onclick="go({page:'reader'})">อ่านฟรี</button>`}</div></div></div>`).join('')}
    </div><aside class="side-box"><div class="eyebrow" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);font-weight:700">RANKING · TOP 5</div>
      ${STORIES.slice(0,5).map((s,i)=>`<div class="rank-row"><span class="rank-n">${i+1}</span><div><b style="font-size:13px">${s.title}</b><span style="font-size:11.5px;color:var(--muted)">★ 4.${9-i} · ${s.ch} ตอน</span></div></div>`).join('')}
      <div class="ad" style="margin-top:12px">แบนเนอร์บนสำหรับ User (FR-X3)</div></aside></div>`;
  }
}
function buyById(id){const s=STORIES.find(x=>x.id===id);buy(s);}

// ---------- STORY ----------
function renderStory(){
  const s=STORIES[1];
  const owned=state.owned.has(2);
  const chapters=Array.from({length:8},(_,i)=>{
    const n=10-i, price=n<=3?0:(n===9?5:3), isOwned=n<=3||state.owned.has(20+n);
    return {n,title:`ตอนที่ ${n} · ${['คืนที่ดาวตก','จดหมายฉบับแรก','ร้านชำปิด','ฝนตกในใจ','ตั๋วรถไฟ','เสียงเปียโน','คืนวันศุกร์','บทใหม่'][i]}`,price,isOwned};
  });
  $('#app').innerHTML=`
  <a href="#" onclick="go({page:'home'});return false" style="font-size:13px;color:var(--muted)">← กลับหน้าแรก</a>
  <div class="story-hero"><div>${coverHTML(s)}</div>
    <div><div class="meta-chips"><span class="mchip hot">🔥 มาแรง #2</span><span class="mchip">${s.type}</span><span class="mchip">${s.status}</span><span class="mchip">17+ ยืนยันอายุก่อนอ่าน (FR-G1)</span></div>
    <h1>${s.title}</h1>
    <div style="font-size:13px;color:var(--muted)">โดยทีม CloudTrans · แปล พิสูจน์อักษร แต่งภาพ ลงตอน (FR-T1) · ★ 4.8 · ติดตาม 12.4k</div>
    <p class="syn">เธอพบกล่องจดหมายที่ไม่เคยถูกส่งในร้านชำยามวิกาล ทุกฉบับจ่าหน้าถึงเธอในอนาคต… เรื่องราวอบอุ่นปนน้ำตาที่อ่านจบในคืนเดียว อัปเดตทุกวันศุกร์ ปลดล็อกก่อนใครด้วยเหรียญ แล้วอ่านฟรีอัตโนมัติหลัง N วัน (FR-E1/FR-X4)</p>
    <div class="action-row"><button class="btn btn-primary" onclick="go({page:'reader'})">อ่านต่อตอนที่ 50</button>
    <button class="btn btn-ghost" id="folBtn">${state.following?'✓ ติดตามแล้ว':'+ ติดตาม'} (FR-L2)</button>
    <button class="btn btn-coin" onclick="toast('ทิปให้นักวาดโดยตรง (FR-E2) · แยกจากค่าปลดล็อก')">♥ ทิป</button></div>
    <div class="split">💰 ส่วนแบ่งทีมวาด — แปล 50% · พิสูจน์ 20% · แต่งภาพ 30% = 100% (FR-M3/M4)<div class="split-bar"><i style="flex:50;background:#7C9BF4"></i><i style="flex:20;background:#7ED0A5"></i><i style="flex:30;background:#F5B544"></i></div></div>
    </div></div>
  <div class="tabs"><button class="on">ตอนทั้งหมด 142</button><button onclick="toast('คอมเมนต์รายตอน + รวมทุกตอน filter ตามตอนได้ (FR-CM2/CM3)')">คอมเมนต์ 1.2k</button><button onclick="toast('แท็ก หมวดหมู่ เรื่องที่เกี่ยวข้อง (FR-C4)')">รายละเอียด</button></div>
  <div>${chapters.map(c=>`<div class="ch-row"><div class="ch-num">${c.n}</div>
    <div><b>${c.title}</b><span>${c.n%2?'12 หน้า · 15 MB':'นิยาย · ~8 นาที'} · 2 วันที่แล้ว ${c.n===9?'· ปลดฟรีใน 5 วัน':''}</span></div>
    <div class="right">${c.isOwned?'<span class="lock owned">✓ เป็นเจ้าของ</span>':c.price===0?'<span class="lock free">FREE</span>':`<span class="lock coin">◉ ${c.price}</span><button class="btn btn-primary btn-sm" onclick="unlockCh(${c.n},${c.price})">ปลดล็อก</button>`}
    <button class="btn btn-ghost btn-sm" onclick="go({page:'reader'})">อ่าน</button></div></div>`).join('')}</div>
  <div class="comment"><div class="who"><span class="ava" style="background:#7C9BF4">M</span><b>mint_reader</b><span style="color:var(--muted)">· ตอนที่ 9 · 2 ชม.ก่อน</span></div><p style="font-size:13.5px;margin:8px 0 0">ตอนนี้ร้องไห้เลย… ฉากจดหมายทำถึงมาก 😭 <span style="color:var(--muted)">(สปอยล์ตอนที่ยังอ่านไม่ถึงจะถูกพับไว้ — FR-CM6)</span></p></div>
  <div class="comment"><div class="who"><span class="ava" style="background:#E5484D">C</span><b>CloudTrans (ทีมวาด 📌)</b><span style="color:var(--muted)">· ปักหมุด</span></div><p style="font-size:13.5px;margin:8px 0 0">ขอบคุณทุกทิป! ตอนหน้าลงวันศุกร์ 2 ทุ่มนะคะ (ปักหมุด/ซ่อนได้เฉพาะเรื่องตัวเอง — FR-CM8)</p></div>`;
  $('#folBtn').onclick=()=>{state.following=!state.following;render();toast(state.following?'ติดตามแล้ว — มีตอนใหม่จะแจ้งเตือนทางอีเมล/LINE (FR-N1a)':'เลิกติดตามแล้ว');};
}
function unlockCh(n,price){
  if(state.coins<price){toast('เหรียญไม่พอ — เติมก่อน (FR-M1)');return;}
  state.coins-=price;$('#coins').textContent=state.coins;state.owned.add(20+n);
  toast(`ปลดล็อกตอนที่ ${n} · <b>−${price}</b> เหรียญ · 1 TX: หัก+ให้สิทธิ์+ลงรายได้ (FR-M3)`);
  setTimeout(render,800);
}

// ---------- READER ----------
function renderReader(){
  const locked=false; // demo: ตอนที่ 50 เป็น coin-locked แต่ mock ว่ายังไม่ซื้อ → โชว์ paywall สลับได้
  const showPaywall=!state.owned.has(50)&&state.readerMode==='locked-demo';
  const pages=[0,1,2,3].map(i=>`<div class="mpage" style="${art(240+i*14,30,26)}"><span style="font-family:var(--font-d);font-size:15px;opacity:.9">${['ท้องฟ้ายามค่ำ — หน้าเปิด','จดหมายฉบับแรก','ร้านชำยามวิกาล','ฝนตกในใจ'][i]}</span><span class="pg">หน้า ${i+1} / 12 · ลิงก์หมดอายุ ไม่ใช่ URL ถาวร (FR-R4)</span></div>`).join('');
  $('#app').innerHTML=`
  <div class="reader-bar"><div class="reader-bar-in">
    <button class="icon-btn" onclick="go({page:'story'})" aria-label="back">←</button>
    <div style="min-width:0"><b style="font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">คืนนี้ฟ้ามีแค่เรา · ตอนที่ 50</b><span style="font-size:11.5px;color:var(--muted)">ตรวจสิทธิ์ก่อนเสิร์ฟทุกครั้ง (FR-R3) · trace_id ใน log (NFR-Obs-1)</span></div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <div class="seg"><button class="${state.readerMode==='paged'?'on':''}" onclick="setMode('paged')">Paged</button><button class="${state.readerMode==='scroll'?'on':''}" onclick="setMode('scroll')">Scroll</button><button onclick="setMode('novel')">Novel</button></div>
      <button class="icon-btn" onclick="theme=theme==='dark'?'light':'dark';localStorage.setItem('manga-theme',theme);document.documentElement.dataset.theme=theme;" title="dark mode (FR-R2)">◐</button>
    </div></div></div>
  <div class="page-col">
    <div class="ad">AD top-banner — สำหรับ User/Uploader (Guest จะเห็นคั่นระหว่างหน้าอ่านแทน) · FR-X3</div>
    ${state.readerMode==='novel'?`
    <div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)">ขนาดฟอนต์ <button class="icon-btn" style="width:30px;height:30px" onclick="state.novelFS=Math.max(14,state.novelFS-1);render()">−</button> ${state.novelFS}px <button class="icon-btn" style="width:30px;height:30px" onclick="state.novelFS=Math.min(24,state.novelFS+1);render()">+</button><span style="margin-left:auto">บันทึกตำแหน่งแบบ debounce ไม่บล็อก UI (FR-L1/NFR-Perf-2)</span></div>
    <article class="novel" style="font-size:${state.novelFS}px"><h2>ตอนที่ 50 · คืนวันศุกร์</h2>
    <p>ฝนเริ่มตกตอนสองทุ่มตรงตามที่พยากรณ์ไว้ไม่มีผิด มิ้นท์ดึงชายเสื้อคลุมของตัวเองให้กระชับขึ้น แล้วก้าวเข้าไปในร้านชำที่แสงไฟสลัว…</p>
    <p>“จดหมายฉบับนี้ จ่าหน้าถึงเธอในอีกสิบปีข้างหน้า” ลายมือนั้นคุ้นเคยอย่างประหลาด เธอกลั้นหายใจก่อนพลิกกระดาษหน้าถัดไป</p>
    <p>เสียงกระดิ่งหน้าร้านดังขึ้นอีกครั้ง — ใครบางคนยืนอยู่ตรงนั้น ท่ามกลางเสียงฝนที่ยังไม่หยุดตก…</p></article>`
    :`${pages}<div class="ad">AD inline — เฉพาะ Guest (FR-X3) · demo นี้ล็อกอินเป็น User จึงเห็นแค่แบนเนอร์บน</div>`}
    <div class="comment" style="border-style:dashed"><b style="font-size:13px">💬 คอมเมนต์ตอนนี้ (12)</b><p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">Guest อ่านได้ · โพสต์ต้องล็อกอิน+ยืนยันอีเมล · ตอนติดเหรียญต้องปลดก่อนถึงเม้นได้ (FR-CM4/CM12)</p></div>
    <div class="reader-nav"><button class="btn btn-ghost" onclick="toast('บันทึกตำแหน่งตอนที่ 49 แล้ว (FR-L1) · sendBeacon กันหาย')">← ตอนก่อน</button><button class="btn btn-ghost" onclick="toast('สารบัญ · ไปตอนไหนก็ได้ที่เคยปลดแล้ว')">สารบัญ (FR-R5)</button><button class="btn btn-primary" onclick="buyDemo()">ตอนต่อไป ◉ 5 →</button></div>
    <p style="font-size:11.5px;color:var(--faint);text-align:center">ปิดแท็บกะทันหันตำแหน่งก็ไม่หาย · Guest merge เข้าบัญชีตอนสมัคร (FR-L4) · ภาพผ่าน CDN ไม่ผ่าน Go (NFR-Scale-2)</p>
  </div>`;
}
function setMode(m){state.readerMode=m;render();toast(m==='novel'?'โหมดนิยาย · ปรับฟอนต์ + dark mode (FR-R2)':m==='scroll'?'โหมด long-scroll/webtoon (FR-R1)':'โหมด paged ทีละหน้า (FR-R1)');}
function buyDemo(){
  if(state.coins<5){toast('เหรียญไม่พอ — เติมผ่าน PromptPay (FR-PAY1)');return;}
  state.coins-=5;state.owned.add(50);$('#coins').textContent=state.coins;
  toast('ซื้อสำเร็จ · <b>−5</b> เหรียญ · ACID+idempotent ห้ามติดลบ (NFR-Money-1)');
}

// ---------- root render ----------
function render(){
  $('#vlabel').textContent=VNAMES[variant]+' · '+page;
  document.querySelectorAll('.proto [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===variant));
  document.querySelectorAll('.proto [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  if(page==='home')renderHome();else if(page==='story')renderStory();else renderReader();
  window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
