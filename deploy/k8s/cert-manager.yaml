# cert-manager + Let's Encrypt for dootoon.store (DNS-01 via Cloudflare).
# Install: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
# Then: create the API token secret, then kubectl apply -f deploy/k8s/cert-manager.yaml
#   kubectl create secret generic cf-api-token --from-literal=api-token='<CF_DNS_EDIT_TOKEN>'
# DNS-01 needs no ingress path and works behind the Cloudflare proxy.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@dootoon.store
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cf-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dootoon-tls
spec:
  secretName: dootoon-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dootoon.store
    - api.dootoon.store
    - obs.dootoon.store
