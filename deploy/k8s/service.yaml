apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: identity
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: catalog
---
apiVersion: v1
kind: Service
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: commerce
---
apiVersion: v1
kind: Service
metadata:
  name: reader
  labels:
    app.kubernetes.io/name: reader
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: reader
---
apiVersion: v1
kind: Service
metadata:
  name: moderation
  labels:
    app.kubernetes.io/name: moderation
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: moderation
---
apiVersion: v1
kind: Service
metadata:
  name: community
  labels:
    app.kubernetes.io/name: community
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: community
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gateway
---
# Only reader is safe to scale today: catalog/commerce/identity/moderation/
# community keep state in memory. Add DB-backed stores before scaling those.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manga-reader-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reader
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
