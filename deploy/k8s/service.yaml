apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: manga-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: identity
---
