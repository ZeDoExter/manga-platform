# Ingress: single entrypoint for local demo (no more port-forwards).
# Hosts resolve via `minikube tunnel` or entries in C:\Windows\System32\drivers\etc\hosts:
#   127.0.0.1 manga.local obs.local
# TLS is terminated with a self-signed cert (see tls-secret.yaml, gitignored);
# on AKS the same rules work with cert-manager + Let's Encrypt (issue #2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manga
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts: [manga.local, obs.local]
      secretName: manga-tls
  rules:
    - host: manga.local
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gateway
                port:
                  number: 80
    - host: obs.local
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: openobserve
                port:
                  number: 5080
---
# Cross-namespace backend: ingress-nginx can't route to another namespace
# directly, so mirror openobserve as an ExternalName in default.
apiVersion: v1
kind: Service
metadata:
  name: openobserve
spec:
  type: ExternalName
  externalName: openobserve.observability.svc.cluster.local
  ports:
    - port: 5080
