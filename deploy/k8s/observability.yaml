# Observability stack (local/demo): OpenTelemetry Collector + OpenObserve single-node.
# Services send OTLP/HTTP traces to http://otel-collector:4318.
# OpenObserve UI: port-forward svc/openobserve 5080:5080 (admin@example.com / Complexpass#123).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: manga-platform-obs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      resource:
        attributes:
          - key: deployment.environment
            value: minikube-demo
            action: insert
    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve:5080/api/default
        headers:
          Authorization: Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM=
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/openobserve, debug]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/openobserve]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/openobserve]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.128.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  ports:
    - port: 4318
      targetPort: 4318
      name: otlp-http
  selector:
    app: otel-collector
---
# NOTE: observability namespace is cluster-scoped here; services reach it as
# http://otel-collector.observability.svc.cluster.local:4318
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v0.15.3
          ports:
            - containerPort: 5080
              name: http
          env:
            - name: ZO_DATA_DIR
              value: /data
            - name: ZO_ROOT_USER_EMAIL
              value: root@example.com
            - name: ZO_ROOT_USER_PASSWORD
              value: Complexpass#123
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 5080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: observability
spec:
  ports:
    - port: 5080
      targetPort: 5080
      name: http
  selector:
    app: openobserve
