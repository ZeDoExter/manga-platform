apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: manga-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: manga-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: web
          image: manga-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://dootoon.store"
            - name: BETTER_AUTH_URL
              value: "https://dootoon.store"
            - name: CATALOG_URL
              value: "http://catalog:80"
            - name: COMMERCE_URL
              value: "http://commerce:80"
            - name: GATEWAY_URL
              value: "http://gateway:80"
            - name: IDENTITY_URL
              value: "http://identity:80"
            - name: LIBRARY_URL
              value: "http://library:80"
            - name: COMMUNITY_URL
              value: "http://community:80"
            - name: MODERATION_URL
              value: "http://moderation:80"
            - name: MEDIA_URL
              value: "http://media:80"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: BETTER_AUTH_SECRET
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
