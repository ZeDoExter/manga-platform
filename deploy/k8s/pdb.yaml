# Voluntary-disruption budgets (node drains/upgrades). web runs 2+ replicas so
# it keeps serving; single-replica services allow their one disruption while
# blocking mass eviction. RollingUpdate maxUnavailable already covers deploys.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reader-pdb
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reader
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-pdb
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-pdb
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media-pdb
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media
