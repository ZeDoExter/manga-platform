# Pulls DATABASE_URL from Key Vault into a k8s Secret via CSI driver.
# Replace VAULT_URI after `terraform apply` (or use external-secrets later).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: manga-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: 59798110-2f17-40ec-a1cc-f48dc31f7e2a
    keyvaultName: manga-demo-kv
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: postgres-auth
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
