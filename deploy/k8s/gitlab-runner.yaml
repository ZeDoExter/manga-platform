# Self-Hosted GitLab Runner on AKS (Kubernetes executor).
# Zero GitLab.com compute minutes consumed; spawns ephemeral job pods inside AKS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: default
data:
  config.template.toml: |
    concurrent = 1
    check_interval = 15

    [[runners]]
      name = "dootoon-aks-k8s-runner"
      url = "https://gitlab.com"
      token = "__RUNNER_TOKEN__"
      executor = "kubernetes"
      request_concurrency = 2
      [runners.kubernetes]
        namespace = "default"
        image = "alpine:latest"
        service_account = "gitlab-runner"
        cpu_request = "50m"
        memory_request = "128Mi"
        helper_cpu_request = "25m"
        helper_memory_request = "64Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: default
  labels:
    app.kubernetes.io/name: gitlab-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-runner
    spec:
      serviceAccountName: gitlab-runner
      containers:
        - name: gitlab-runner
          image: gitlab/gitlab-runner:alpine
          command: ["sh", "-c", "sed \"s/__RUNNER_TOKEN__/$RUNNER_TOKEN/\" /etc/gitlab-runner-tpl/config.template.toml > /etc/gitlab-runner/config.toml && exec gitlab-runner run --config=/etc/gitlab-runner/config.toml"]
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-token
                  key: RUNNER_TOKEN
          volumeMounts:
            - name: config-tpl
              mountPath: /etc/gitlab-runner-tpl
            - name: config
              mountPath: /etc/gitlab-runner
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: config-tpl
          configMap:
            name: gitlab-runner-config
        - name: config
          emptyDir: {}
