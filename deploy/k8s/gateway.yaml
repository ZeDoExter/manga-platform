# Gateway API (replaces NGINX Ingress, EOL March 2026).
# Single entrypoint: manga.local -> gateway API, obs.local -> OpenObserve.
# TLS via the same self-signed manga-tls secret; on AKS swap the
# GatewayClass to Azure Application Gateway for Containers.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: manga
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: manga-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manga-api
spec:
  parentRefs:
    - name: manga
  hostnames: [manga.local]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obs-ui
spec:
  parentRefs:
    - name: manga
  hostnames: [obs.local]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openobserve
          namespace: observability
          port: 5080
